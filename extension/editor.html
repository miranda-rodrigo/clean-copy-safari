<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Clean Copy</title><link rel="stylesheet" href="style.css">
<main><header><span class="mark">↗</span><div><h1>Clean Copy</h1><p>A little less noise. A better link.</p></div></header>
<section id="editor" hidden><h2>Make it yours</h2><label>Title<input id="title"></label><label>Destination<input id="url" type="url"></label><label>Quotation <span>optional · preserved as written</span><textarea id="quote" rows="4"></textarea></label><label>Format<select id="format"><option value="markdown">Markdown</option><option value="rich">Rich-text link</option><option value="plain">Title + URL</option></select></label><div class="preview" id="preview"></div><button id="copy">Copy link</button><p id="status" role="status" aria-live="polite"></p></section>
<section><h2>Your defaults</h2><label>Copy format<select id="defaultFormat"><option value="markdown">Markdown</option><option value="rich">Rich-text link</option><option value="plain">Title + URL</option></select></label><label class="check"><input id="clean" type="checkbox">Remove known tracking parameters</label><label class="check"><input id="selection" type="checkbox">Include selected text as a quotation</label><button class="secondary" id="save">Save preferences</button><p id="saved" role="status"></p></section>
<footer>Local processing · No account · No analytics<br>Toolbar: copy · Option ⇧ C: copy · Option ⇧ E: edit<br>Shortcut availability depends on Safari and existing shortcuts.</footer></main><script src="core.js"></script><script src="editor.js"></script></html>
